<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>allPanes</title>
    <link rel="stylesheet" href="result.css" />
    <script type="module" src="result.js"></script>
  </head>
  <body>
    <header class="bar">
      <div class="meta">
        <h1 id="title">allPanes</h1>
        <span id="dims"></span>
      </div>
      <div class="actions" id="actions" hidden>
        <button id="options" type="button" class="quiet">Options</button>
        <button id="size" type="button">Actual size</button>
        <button id="copy" type="button">Copy image</button>
        <button id="download-alt" type="button">Download JPEG</button>
        <button id="download" type="button" class="primary">Download PNG</button>
      </div>
    </header>
    <main>
      <p id="notes" class="notes" hidden></p>
      <div id="stage" class="stage fit">
        <img id="shot" alt="Full-page capture" hidden />
      </div>
    </main>
    <!-- Screen-reader announcements: polite for confirmations and warnings, alert for failures. -->
    <div id="announce-polite" class="visually-hidden" aria-live="polite"></div>
    <div id="announce-alert" class="visually-hidden" role="alert"></div>
  </body>
</html>
