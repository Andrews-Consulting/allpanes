        fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="30" y="30" width="68" height="68" rx="7" fill="#ffffff"/>
  <rect x="46" y="30" width="6" height="68" fill="#2563eb"/>
  <rect x="76" y="30" width="6" height="68" fill="#2563eb"/>
  <rect x="61" y="42" width="6" height="29" rx="3" fill="#2563eb"/>
  <path d="M53 65 L64 87 L75 65 Z" fill="#2563eb"/>
</svg>
