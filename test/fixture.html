<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>allPanes fixture</title>
<!--
  A typical web-app shell: a 100dvh flex row whose sidebar nav and main column each scroll on their
  own, a sticky header inside the main column, a sticky rail sized to the window, a fixed-height
  inner table, a floating button, and an off-canvas drawer (like a closed chat panel) that must NOT
  drive the image size.
-->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color: #111; }
  .shell { height: 100dvh; display: flex; }
  aside { width: 256px; display: flex; flex-direction: column; background: #e8ecf8; border-right: 1px solid #c5cbe0; }
  .brand { height: 56px; flex: none; padding: 16px; font-weight: 700; border-bottom: 1px solid #c5cbe0; }
  /* Smooth scrolling, as many sites set: restoring scroll positions must still land instantly. */
  nav { flex: 1; min-height: 0; overflow-y: auto; scroll-behavior: smooth; }
  nav div { padding: 6px 16px; border-bottom: 1px solid #d6dbec; }
  .foot { flex: none; padding: 12px 16px; border-top: 1px solid #c5cbe0; background: #dde3f4; }
  .col { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow-y: auto; }
  header { position: sticky; top: 0; z-index: 2; height: 48px; flex: none; padding: 12px 24px; background: #fffbe8; border-bottom: 2px solid #d9b500; }
  main { padding: 24px; display: flex; gap: 24px; align-items: flex-start; }
  .content { flex: 1; min-width: 0; }
  .row { padding: 8px 12px; border-bottom: 1px solid #eee; }
  .clamped { max-height: 320px; overflow-y: auto; margin: 16px 0; border: 3px solid #d97706; background: #fff7ed; }
  .rail { width: 300px; flex: none; position: sticky; top: 64px; max-height: calc(100vh - 80px); overflow-y: auto; border: 3px solid #0284c7; background: #f0f9ff; }
  .fab { position: fixed; right: 20px; bottom: 20px; width: 48px; height: 48px; border-radius: 50%; background: #db2777; }
  .drawer { position: fixed; top: 0; bottom: 0; right: 0; width: 400px; transform: translateX(100%); overflow-y: auto; background: #fee2e2; }
  .end { padding: 12px; font-weight: 700; background: #dcfce7; }
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand">Fixture app</div>
    <nav id="nav"></nav>
    <div class="foot">sidebar footer</div>
  </aside>
  <div class="col" id="col">
    <header>Sticky header</header>
    <main>
      <div class="content" id="content"></div>
      <div class="rail" id="rail"></div>
    </main>
  </div>
</div>
<div class="fab"></div>
<div class="drawer" id="drawer"></div>
<script>
  const rows = (parent, n, label, cls = "row") => {
    for (let i = 1; i <= n; i++) {
      const d = document.createElement("div");
      d.className = cls;
      d.textContent = `${label} ${i}`;
      parent.append(d);
    }
  };
  const end = (parent, text) => {
    const d = document.createElement("div");
    d.className = "end";
    d.textContent = text;
    parent.append(d);
    return d;
  };
  const params = new URLSearchParams(location.search);
  const nav = document.getElementById("nav");
  rows(nav, Number(params.get("nav") ?? 70), "Nav item", "");
  end(nav, "END OF NAV");

  const content = document.getElementById("content");
  rows(content, 25, "Main row");
  const clamped = document.createElement("div");
  clamped.className = "clamped";
  clamped.id = "clamped";
  rows(clamped, 40, "Clamped table row");
  end(clamped, "END OF CLAMPED TABLE");
  content.append(clamped);
  rows(content, 30, "Main row (after table)");
  const mainEnd = end(content, "END OF MAIN");

  // ?late=N: N more rows arrive 900 ms after the first resize, as data still loading would arrive
  // in the middle of a capture. The capture's own resize is the first one this page sees.
  const late = Number(params.get("late") ?? 0);
  if (late) {
    addEventListener("resize", () => setTimeout(() => {
      const holder = document.createElement("div");
      rows(holder, late, "Late row");
      mainEnd.before(...holder.children);
    }, 900), { once: true });
  }

  const rail = document.getElementById("rail");
  rows(rail, 55, "Rail item");
  end(rail, "END OF RAIL");

  rows(document.getElementById("drawer"), 300, "Hidden drawer row");
</script>
</body>
</html>
