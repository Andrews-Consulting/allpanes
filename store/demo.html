<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Website relaunch · Example Team</title>
<!--
  Demo app for the Chrome Web Store screenshots (store/screenshots.mjs). An unbranded project
  tracker built the way many web apps are: a full-height grid whose sidebar, task list and task
  details each scroll on their own, so the browser shows only the top of each. The content is
  fixed, not random, so the screenshots come out the same every time.
-->
<style>
  :root {
    color-scheme: light;
    --bg: #f7f8fa;
    --panel: #ffffff;
    --sidebar: #f1f3f7;
    --border: #e3e6ec;
    --text: #1f2430;
    --muted: #6b7280;
    --accent: #4f46e5;
    --accent-soft: #eef0ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); background: var(--bg); }
  h1, h2, h3, p, ul, ol { margin: 0; }
  ul, ol { padding: 0; list-style: none; }

  .app {
    block-size: 100dvh;
    display: grid;
    grid-template-columns: 248px minmax(0, 1fr) 360px;
    grid-template-rows: minmax(0, 1fr);
    grid-template-areas: "sidebar main detail";
  }

  /* Sidebar: fixed header and footer, the navigation between them scrolls. */
  .sidebar { grid-area: sidebar; display: flex; flex-direction: column; min-block-size: 0; background: var(--sidebar); border-inline-end: 1px solid var(--border); }
  .workspace { display: flex; align-items: center; gap: 10px; padding: 14px 16px; font-weight: 650; }
  .logo { inline-size: 28px; block-size: 28px; border-radius: 7px; display: grid; place-items: center; color: #fff; background: var(--accent); font-weight: 700; }
  .search { margin: 0 12px 8px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); color: var(--muted); display: flex; justify-content: space-between; }
  .search kbd { font: 12px system-ui; color: var(--muted); }
  .nav { flex: 1; min-block-size: 0; overflow-y: auto; padding: 4px 8px 12px; }
  .nav h2 { margin: 16px 8px 6px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .nav a { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 6px; color: inherit; text-decoration: none; }
  .nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav .count { margin-inline-start: auto; font-size: 12px; color: var(--muted); }
  .dot { inline-size: 8px; block-size: 8px; border-radius: 50%; flex: none; }
  .me { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-block-start: 1px solid var(--border); }

  /* Main column: scrolls, with a sticky top bar. */
  .main { grid-area: main; overflow-y: auto; background: var(--panel); }
  .topbar { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 12px; padding: 10px 28px; background: rgb(255 255 255 / .92); border-block-end: 1px solid var(--border); }
  .crumbs { color: var(--muted); }
  .crumbs strong { color: var(--text); font-weight: 600; }
  .topbar .spacer { flex: 1; }
  .button { padding: 6px 12px; border-radius: 7px; border: 1px solid var(--border); background: var(--panel); font: inherit; }
  .button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .project { padding: 24px 28px 8px; }
  .project h1 { font-size: 24px; line-height: 1.2; }
  .project p { margin-block-start: 6px; color: var(--muted); max-inline-size: 62ch; }
  .progress { display: flex; align-items: center; gap: 10px; margin-block-start: 14px; font-size: 13px; color: var(--muted); }
  .bar { inline-size: 220px; block-size: 6px; border-radius: 3px; background: var(--border); overflow: clip; }
  .bar span { display: block; block-size: 100%; inline-size: 38%; background: var(--accent); }
  .tabs { display: flex; gap: 22px; padding: 14px 28px 0; border-block-end: 1px solid var(--border); }
  .tabs span { padding-block-end: 10px; color: var(--muted); }
  .tabs .on { color: var(--text); font-weight: 600; box-shadow: inset 0 -2px var(--accent); }
  .group { padding: 18px 28px 4px; }
  .group h2 { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 650; padding-block-end: 6px; }
  .group h2 .n { color: var(--muted); font-weight: 500; }
  .task { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto 28px 76px; align-items: center; gap: 12px; padding: 9px 4px; border-block-start: 1px solid var(--border); }
  .task.selected { background: var(--accent-soft); border-radius: 6px; }
  .check { inline-size: 16px; block-size: 16px; border-radius: 50%; border: 1.5px solid #b8bec9; }
  .task.done .check { background: #16a34a; border-color: #16a34a; }
  .task.done .title { color: var(--muted); text-decoration: line-through; }
  .title { overflow: clip; text-overflow: ellipsis; white-space: nowrap; }
  .tags { display: flex; gap: 6px; }
  .tag { font-size: 11px; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  .avatar { inline-size: 26px; block-size: 26px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 700; flex: none; }
  .due { font-size: 12px; color: var(--muted); text-align: end; }
  .due.soon { color: #c2410c; font-weight: 600; }

  /* Task details: scrolls, with a sticky header of its own. */
  .detail { grid-area: detail; overflow-y: auto; background: var(--panel); border-inline-start: 1px solid var(--border); }
  .detail header { position: sticky; top: 0; z-index: 1; padding: 16px 20px 12px; background: var(--panel); border-block-end: 1px solid var(--border); }
  .detail header h2 { font-size: 17px; line-height: 1.3; }
  .pill { display: inline-block; margin-block-start: 6px; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #fef3c7; color: #92400e; font-weight: 600; }
  .detail section { padding: 16px 20px; border-block-end: 1px solid var(--border); }
  .detail h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-block-end: 10px; }
  .fields { display: grid; grid-template-columns: 90px 1fr; gap: 8px 12px; font-size: 13px; }
  .fields dt { color: var(--muted); }
  .fields dd { margin: 0; display: flex; align-items: center; gap: 8px; }
  .detail p + p { margin-block-start: 10px; }
  .subtasks li, .files li { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
  .subtasks .done { color: var(--muted); text-decoration: line-through; }
  .box { inline-size: 15px; block-size: 15px; border-radius: 4px; border: 1.5px solid #b8bec9; flex: none; }
  .subtasks .done .box { background: var(--accent); border-color: var(--accent); }
  .files .size { margin-inline-start: auto; color: var(--muted); font-size: 12px; }
  .activity li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 8px 0; }
  .activity .who { font-weight: 600; }
  .activity .when { color: var(--muted); font-size: 12px; }
  .activity .event { color: var(--muted); }
  .comment { margin: 16px 20px 20px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="Workspace">
    <div class="workspace"><span class="logo" aria-hidden="true">E</span> Example Team</div>
    <div class="search">Search <kbd>Ctrl K</kbd></div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="me"><span class="avatar" style="background:#4f46e5">JK</span> Jamie Kim</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <span class="crumbs">Projects / <strong>Website relaunch</strong></span>
      <span class="spacer"></span>
      <button class="button" type="button">Share</button>
      <button class="button primary" type="button">New task</button>
    </div>
    <div class="project">
      <h1>Website relaunch</h1>
      <p>New marketing site, CMS migration and launch plan. Target: live before the November product announcement.</p>
      <div class="progress"><span class="bar"><span></span></span> 18 of 46 tasks done · Due Nov 18</div>
    </div>
    <div class="tabs"><span class="on">List</span><span>Board</span><span>Timeline</span><span>Files</span></div>
    <div id="groups"></div>
  </main>

  <aside class="detail" aria-label="Task details" id="detail"></aside>
</div>

<script>
  const people = {
    JK: ["Jamie Kim", "#4f46e5"], AR: ["Alex Rivera", "#0891b2"], SN: ["Sam Nguyen", "#db2777"],
    PM: ["Priya Mehta", "#ea580c"], TO: ["Taylor Okafor", "#16a34a"], MB: ["Morgan Blake", "#9333ea"],
  };
  const tags = {
    Design: ["#fce7f3", "#9d174d"], Content: ["#fef3c7", "#92400e"], Engineering: ["#dbeafe", "#1e40af"],
    SEO: ["#dcfce7", "#166534"], Research: ["#ede9fe", "#5b21b6"], QA: ["#e2e8f0", "#334155"],
  };
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const avatar = (i) => `<span class="avatar" style="background:${people[i][1]}" title="${people[i][0]}">${i}</span>`;
  const tag = (t) => `<span class="tag" style="background:${tags[t][0]};color:${tags[t][1]}">${t}</span>`;

  // [title, tags, assignee, due]
  const groups = [
    ["In progress", "#f59e0b", [
      ["Redesign pricing page", ["Design", "Content"], "SN", "Oct 30"],
      ["Migrate blog posts to the new CMS", ["Engineering"], "AR", "Nov 1"],
      ["Write copy for the homepage hero", ["Content"], "PM", "Oct 31"],
      ["Set up redirects for retired URLs", ["Engineering", "SEO"], "TO", "Nov 3"],
      ["Build shared component library", ["Engineering"], "AR", "Nov 4"],
      ["Usability test the new navigation", ["Research"], "MB", "Nov 2"],
      ["Compress and convert hero images", ["Engineering"], "JK", "Oct 30"],
    ]],
    ["Up next", "#6366f1", [
      ["Draft case study: logistics customer", ["Content"], "PM", "Nov 6"],
      ["Add structured data to product pages", ["SEO"], "TO", "Nov 7"],
      ["Accessibility audit of checkout", ["QA"], "MB", "Nov 8"],
      ["Design 404 and error pages", ["Design"], "SN", "Nov 8"],
      ["Localize pricing for EU markets", ["Content"], "PM", "Nov 10"],
      ["Set up analytics events for signup", ["Engineering"], "AR", "Nov 10"],
      ["Review legal pages with counsel", ["Content"], "JK", "Nov 11"],
      ["Create social share images", ["Design"], "SN", "Nov 12"],
      ["Load test the new hosting", ["Engineering", "QA"], "AR", "Nov 12"],
      ["Update footer links and sitemap", ["SEO"], "TO", "Nov 13"],
      ["Prepare launch announcement email", ["Content"], "PM", "Nov 14"],
    ]],
    ["Backlog", "#94a3b8", [
      ["Dark mode for the marketing site", ["Design"], "SN", ""],
      ["Interactive pricing calculator", ["Engineering"], "AR", ""],
      ["Refresh the customer logo wall", ["Design"], "SN", ""],
      ["Short product video for the homepage", ["Content"], "PM", ""],
      ["Glossary pages", ["SEO"], "TO", ""],
      ["Search for the docs section", ["Engineering"], "AR", ""],
      ["Rewrite the About page", ["Content"], "JK", ""],
      ["Partner directory", ["Engineering"], "TO", ""],
      ["Animated product tour", ["Design"], "SN", ""],
      ["Review cookie consent banner", ["QA"], "MB", ""],
      ["Careers page redesign", ["Design"], "SN", ""],
      ["Newsletter archive", ["Content"], "PM", ""],
      ["Status page link in the header", ["Engineering"], "AR", ""],
      ["Regional landing pages", ["SEO"], "TO", ""],
      ["Testimonials section", ["Design"], "SN", ""],
      ["Performance budget in the build", ["Engineering"], "JK", ""],
    ]],
    ["Done", "#16a34a", [
      ["Kickoff and goals document", ["Research"], "JK", "Sep 30"],
      ["Stakeholder interviews", ["Research"], "MB", "Oct 2"],
      ["Content inventory", ["Content"], "PM", "Oct 3"],
      ["Sitemap and page list", ["SEO"], "TO", "Oct 6"],
      ["Wireframes: homepage", ["Design"], "SN", "Oct 8"],
      ["Wireframes: pricing", ["Design"], "SN", "Oct 9"],
      ["Choose a CMS", ["Engineering"], "AR", "Oct 10"],
      ["Design tokens and type scale", ["Design"], "SN", "Oct 14"],
      ["Hosting and CDN setup", ["Engineering"], "AR", "Oct 16"],
      ["Analytics baseline report", ["Research"], "MB", "Oct 17"],
      ["Brand voice guidelines", ["Content"], "PM", "Oct 20"],
      ["Staging environment", ["Engineering"], "JK", "Oct 22"],
    ]],
  ];

  document.getElementById("groups").innerHTML = groups.map(([name, color, tasks]) => `
    <section class="group">
      <h2><span class="dot" style="background:${color}"></span>${name} <span class="n">${tasks.length}</span></h2>
      <ol>${tasks.map(([title, ts, who, due], i) => `
        <li class="task${name === "Done" ? " done" : ""}${name === "In progress" && i === 0 ? " selected" : ""}">
          <span class="check"></span>
          <span class="title">${esc(title)}</span>
          <span class="tags">${ts.map(tag).join("")}</span>
          ${avatar(who)}
          <span class="due${/Oct 3[01]/.test(due) && name !== "Done" ? " soon" : ""}">${due || "No date"}</span>
        </li>`).join("")}
      </ol>
    </section>`).join("");

  const projects = [
    ["Website relaunch", "#4f46e5"], ["Mobile app 3.0", "#0891b2"], ["Q4 campaign", "#ea580c"],
    ["Customer onboarding", "#16a34a"], ["Billing migration", "#9333ea"], ["Help center", "#db2777"],
    ["Partner program", "#ca8a04"], ["Security review", "#334155"], ["Hiring: design", "#db2777"],
    ["Hiring: engineering", "#0891b2"], ["Annual report", "#ea580c"], ["Pricing research", "#9333ea"],
    ["Data warehouse", "#16a34a"], ["Event: user summit", "#4f46e5"], ["Docs overhaul", "#ca8a04"],
    ["Brand refresh", "#db2777"], ["Office move", "#334155"], ["Support tooling", "#0891b2"],
    ["Localization", "#16a34a"], ["Email templates", "#ea580c"], ["Accessibility roadmap", "#9333ea"],
    ["Archive: 2025 launch", "#94a3b8"],
  ];
  const teams = ["Design", "Engineering", "Marketing", "Support", "Operations", "Finance"];
  document.getElementById("nav").innerHTML = `
    <a href="#">Home</a>
    <a href="#">Inbox <span class="count">4</span></a>
    <a href="#">My tasks <span class="count">12</span></a>
    <a href="#">Reports</a>
    <h2>Projects</h2>
    ${projects.map(([p, c], i) => `<a href="#"${i === 0 ? ' aria-current="page"' : ""}><span class="dot" style="background:${c}"></span>${p}</a>`).join("")}
    <h2>Teams</h2>
    ${teams.map((t) => `<a href="#">${t}</a>`).join("")}
    <h2>Workspace</h2>
    <a href="#">Members</a><a href="#">Integrations</a><a href="#">Settings</a>`;

  const subtasks = [
    [1, "Gather analytics on the current page"], [1, "Sketch three layout options"],
    [1, "Review options with marketing"], [1, "Pick a direction"],
    [0, "High-fidelity mockup, desktop"], [0, "High-fidelity mockup, mobile"],
    [0, "Annual and monthly toggle states"], [0, "Hand off to engineering"], [0, "Review the build on staging"],
  ];
  // [who, text, when, isEvent]
  const activity = [
    ["PM", "Copy for the plan cards is in the doc. I kept each to two lines.", "2 hours ago"],
    ["SN", "attached pricing-v3-mobile.png", "3 hours ago", 1],
    ["AR", "The toggle can reuse the segmented control from the component library, so no new work there.", "5 hours ago"],
    ["MB", "In testing, 4 of 6 people missed the annual discount. Could it sit on the toggle itself?", "Yesterday"],
    ["SN", "Good catch. Moved it onto the toggle as a badge.", "Yesterday"],
    ["JK", "changed the due date to Oct 30", "Yesterday", 1],
    ["TO", "Please keep the plan anchors (#team, #business). Sales links to them.", "2 days ago"],
    ["SN", "attached pricing-v3-desktop.png", "2 days ago", 1],
    ["PM", "Legal signed off on the refund wording.", "3 days ago"],
    ["SN", "moved this to In progress", "4 days ago", 1],
    ["JK", "Let's aim for a review on Thursday.", "4 days ago"],
    ["MB", "attached usability-notes.pdf", "5 days ago", 1],
    ["AR", "Plan data can come from the same file as the checkout, so the prices never disagree.", "6 days ago"],
    ["JK", "created this task", "1 week ago", 1],
  ];
  document.getElementById("detail").innerHTML = `
    <header><h2>Redesign pricing page</h2><span class="pill">In progress</span></header>
    <section>
      <dl class="fields">
        <dt>Assignee</dt><dd>${avatar("SN")} Sam Nguyen</dd>
        <dt>Due date</dt><dd>Oct 30</dd>
        <dt>Priority</dt><dd><span class="dot" style="background:#dc2626"></span> High</dd>
        <dt>Tags</dt><dd>${tag("Design")}${tag("Content")}</dd>
      </dl>
    </section>
    <section>
      <h3>Description</h3>
      <p>The current pricing page buries the plan comparison below three screens of marketing copy, and most visitors who reach it leave. Move the comparison to the top, keep the copy short, and make the annual and monthly toggle obvious.</p>
      <p>Keep the three existing plans. Legal has approved new wording for the refund policy; use it exactly as written.</p>
    </section>
    <section>
      <h3>Subtasks · 4 of 9</h3>
      <ul class="subtasks">${subtasks.map(([d, t]) => `<li class="${d ? "done" : ""}"><span class="box"></span>${t}</li>`).join("")}</ul>
    </section>
    <section>
      <h3>Files</h3>
      <ul class="files">
        <li>pricing-v3-desktop.png <span class="size">2.4 MB</span></li>
        <li>pricing-v3-mobile.png <span class="size">1.1 MB</span></li>
        <li>usability-notes.pdf <span class="size">310 KB</span></li>
      </ul>
    </section>
    <section>
      <h3>Activity</h3>
      <ul class="activity">${activity.map(([who, text, when, event]) => `
        <li>${avatar(who)}<div><span class="who">${people[who][0]}</span>
          ${event ? `<span class="event">${esc(text)}</span>` : ""}
          <span class="when">· ${when}</span>
          ${event ? "" : `<p>${esc(text)}</p>`}</div></li>`).join("")}
      </ul>
    </section>
    <div class="comment">Add a comment…</div>`;
</script>
</body>
</html>
